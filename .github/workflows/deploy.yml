name: deploy-viewer

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours, at minute 23
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # CelesTrak refreshes its data every few hours and asks users not to re-download it
      # constantly, so the catalog is cached per 6-hour window: pushes within the same window
      # reuse it, and only the first run of each window downloads.
      - name: Compute catalog cache key
        id: bucket
        run: echo "key=catalog-$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - name: Restore cached catalog
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: catalog-cache
          key: ${{ steps.bucket.outputs.key }}

      - name: Download catalog from CelesTrak
        id: download
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true   # a slow or blocked download must not stop the site from updating
        timeout-minutes: 10
        run: |
          mkdir -p catalog-cache
          bash scripts/fetch_catalog.sh catalog-cache/catalog.tle
          date -u +'%Y-%m-%d %H:%M UTC' > catalog-cache/fetched.txt

      # Only a successful download is cached, so a fallback never masquerades as fresh data.
      - name: Save catalog to cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: catalog-cache
          key: ${{ steps.bucket.outputs.key }}

      # If CelesTrak could not be reached, keep the catalog that is already published and say
      # so in the page's data panel (the HUD shows this text next to "Data").
      - name: Fall back to the catalog already published
        if: steps.cache.outputs.cache-hit != 'true' && steps.download.outcome != 'success'
        run: |
          echo "::warning::CelesTrak download failed; reusing the catalog from the published site"
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p catalog-cache
          curl --fail --silent --show-error --max-time 120 --retry 3 -o catalog-cache/catalog.tle "$SITE/catalog.tle"
          curl --fail --silent --show-error --max-time 30 --retry 3 -o previous-build-info.json "$SITE/build-info.json"
          python3 -c "import json; print(json.load(open('previous-build-info.json'))['catalogFetchedUtc'].split(' (')[0] + ' (reused: CelesTrak unreachable)')" > catalog-cache/fetched.txt
          cat catalog-cache/fetched.txt

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.13
          "$HOME/emsdk/emsdk" activate 6.0.13

      - name: Build WebAssembly
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j

      - name: Assemble site
        run: |
          mkdir -p site/data
          cp web/index.html web/main.js web/mat4.js web/picking.js web/geometry.js site/
          cp web/data/ne_110m_coastline.geojson site/data/
          cp build-wasm/orbitcore_wasm.js build-wasm/orbitcore_wasm.wasm site/
          cp catalog-cache/catalog.tle site/catalog.tle
          printf '{"catalogFetchedUtc": "%s", "commit": "%s"}\n' \
            "$(cat catalog-cache/fetched.txt)" "${GITHUB_SHA::7}" > site/build-info.json
          cat site/build-info.json
          ls -lh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4