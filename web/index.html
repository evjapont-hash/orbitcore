<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEO situational awareness · orbitcore</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080f;
      --panel: rgba(10, 16, 26, 0.84);
      --line: #22334a;
      --text: #cfe0f5;
      --dim: #7f93ad;
      --accent: #50c8ff;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .panel {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
    }
    #hud { top: 12px; left: 12px; white-space: pre; min-width: 320px; }
    #legend { top: 12px; right: 12px; }
    #legend div { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    #info { top: 120px; right: 12px; white-space: pre; min-width: 300px; display: none; }
    #info .head { color: var(--accent); }
    #info .warn { color: #ffb454; }
    .ok { color: #7dff9b; }
    .dim { color: var(--dim); }
    #stations { top: 350px; left: 12px; min-width: 340px; }
    #stations .head { color: var(--accent); margin-bottom: 4px; }
    .srow { display: flex; gap: 10px; align-items: baseline; }
    .srow .name { flex: 1; }
    .srow button { padding: 0 7px; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    #station-note { color: var(--dim); margin-top: 6px; min-height: 1.5em; }
    select {
      font: inherit;
      color: var(--text);
      background: #0e1a2a;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 3px 6px;
    }
    #find { top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; }
    #find input {
      font: inherit;
      color: var(--text);
      background: #0e1a2a;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 4px 8px;
      width: 15em;
    }
    #find-note { color: #ffb454; }
    #events { bottom: 12px; left: 420px; right: 500px; min-width: 460px; max-height: 62vh; overflow: auto; display: none; }
    #events .head { color: var(--accent); }
    #events label { color: var(--dim); }
    #events input {
      font: inherit;
      color: var(--text);
      background: #0e1a2a;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 3px 6px;
      width: 4em;
    }
    #screen-status { color: var(--dim); margin-top: 6px; min-height: 1.5em; }
    .ehead, .erow { display: grid; grid-template-columns: 2.4em 10.5em 6.5em 6.5em 5.5em 1fr; gap: 8px; padding: 1px 4px; }
    .ehead { color: var(--dim); border-bottom: 1px solid var(--line); margin-top: 6px; }
    .erow { cursor: pointer; }
    .erow:hover { background: #12233a; }
    .erow.active { background: #173250; color: var(--accent); }
    #event-detail { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    #ev-lines { white-space: pre; margin: 4px 0; }
    #ev-live { color: var(--accent); }
    #burn-section { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    #burn-section .head { color: #8fe3a2; }
    #burn-status { color: var(--dim); margin-top: 6px; }
    .bhead, .brow { display: grid; grid-template-columns: 2em 5.5em 7.5em 1fr 7em 5.5em; gap: 8px; padding: 1px 4px; }
    .bhead { color: var(--dim); border-bottom: 1px solid var(--line); margin-top: 6px; }
    .brow { cursor: pointer; }
    .brow:hover { background: #12233a; }
    .brow.active { background: #173a2c; color: #8fe3a2; }
    .brow.off { color: var(--dim); cursor: default; }
    .brow.off:hover { background: none; }
    .brow .note { grid-column: 3 / -1; }
    #burn-detail { white-space: pre; margin: 6px 0; }
    button:disabled { opacity: 0.5; cursor: default; }
    #controls { bottom: 12px; left: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #controls .label { color: var(--dim); margin-right: 4px; }
    button {
      font: inherit;
      color: var(--text);
      background: #0e1a2a;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--dim); }
    button.active { border-color: var(--accent); color: var(--accent); }
    #hint { bottom: 12px; right: 12px; color: var(--dim); }
    #message {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--dim);
      background: var(--bg);
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud" class="panel"></div>
  <div id="legend" class="panel"></div>
  <div id="info" class="panel"></div>
  <div id="stations" class="panel">
    <div class="head">GROUND STATIONS</div>
    <div id="station-list"></div>
    <div class="row">
      <button id="btn-add-station">Add by click</button>
      <button id="btn-presets">Add presets</button>
      <button id="btn-clear-stations">Clear</button>
    </div>
    <div class="row">
      <label for="mask-select" class="dim">Min elevation</label>
      <select id="mask-select">
        <option value="0">0°</option>
        <option value="5">5°</option>
        <option value="10" selected>10°</option>
        <option value="15">15°</option>
        <option value="20">20°</option>
        <option value="30">30°</option>
      </select>
      <span class="dim">cones end at 1,000 km altitude</span>
    </div>
    <div id="station-note"></div>
  </div>
  <div id="find" class="panel">
    <input id="find-input" placeholder="Find: NORAD id or name (e.g. 25544)" autocomplete="off">
    <button id="btn-find">Find</button>
    <span id="find-note"></span>
  </div>
  <div id="events" class="panel">
    <div id="events-title" class="head">CONJUNCTION SCREENING</div>
    <div class="row">
      <label for="screen-days">Window</label>
      <select id="screen-days">
        <option value="1">1 day</option>
        <option value="3" selected>3 days</option>
        <option value="7">7 days</option>
      </select>
      <label for="screen-threshold">Within</label>
      <select id="screen-threshold">
        <option value="10">10 km</option>
        <option value="25" selected>25 km</option>
        <option value="50">50 km</option>
      </select>
      <label for="screen-hbr">Hard body</label>
      <input id="screen-hbr" type="number" min="1" max="500" step="1" value="10"> <span class="dim">m</span>
      <button id="btn-screen" disabled>Select a satellite first</button>
    </div>
    <div id="screen-status"></div>
    <div id="event-list"></div>
    <div id="event-detail" style="display: none">
      <div id="ev-title" class="head"></div>
      <div id="ev-lines"></div>
      <div id="ev-live"></div>
      <div class="row">
        <button data-step="-60">-60 s</button>
        <button data-step="-10">-10 s</button>
        <button data-step="10">+10 s</button>
        <button data-step="60">+60 s</button>
        <button id="btn-tca">Closest approach</button>
        <button id="btn-event-close">Back to globe</button>
      </div>
      <div id="burn-section">
        <div class="head">AVOIDANCE BURN</div>
        <div class="row">
          <label for="burn-target">Target miss</label>
          <input id="burn-target" type="number" min="0.5" step="1" value="10"> <span class="dim">km</span>
          <button id="btn-plan">Plan burns</button>
        </div>
        <div id="burn-status"></div>
        <div id="burn-list"></div>
        <div id="burn-detail"></div>
        <div id="burn-actions" class="row" style="display: none">
          <button id="btn-burn-at">At the burn</button>
          <button id="btn-burn-after">At closest approach</button>
        </div>
      </div>
    </div>
  </div>
  <div id="controls" class="panel">
    <span class="label">Time</span>
    <button id="btn-pause">Pause</button>
    <button data-scale="1">x1</button>
    <button data-scale="60">x60</button>
    <button data-scale="600">x600</button>
    <button data-scale="3600">x3600</button>
    <button id="btn-now">Now</button>
  </div>
  <div id="hint" class="panel">drag: rotate · wheel: zoom · click: select · Esc: clear</div>
  <div id="message">Starting…</div>

  <!-- orbitcore compiled to WebAssembly (defines the global createOrbitcore) -->
  <script src="orbitcore_wasm.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
